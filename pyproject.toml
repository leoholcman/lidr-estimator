[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de proyectos de software con LLM (CAG) — AI Engineering LIDR"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "openai>=3.36.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "streamlit>=1.67.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
